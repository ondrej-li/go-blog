# Security headers for go.ondralinek.cz.
#
# add_header does not accumulate across levels: a location that sets any header
# drops the ones inherited from the server block, so include this file in every
# location that adds headers of its own.
add_header Strict-Transport-Security    "max-age=31536000" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The theme predates modern CSP: pages carry inline scripts (highlight.js
# bootstrap, Twitter and Facebook share buttons), load Google Fonts and cdnjs
# CSS, and embed Disqus comments. The policy allows exactly those origins
# instead of weakening it to 'self' plus 'unsafe-inline' everywhere.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://platform.twitter.com https://connect.facebook.net https://disqus.com https://*.disqus.com https://*.disquscdn.com; frame-src https://disqus.com https://*.disqus.com https://www.facebook.com https://platform.twitter.com https://syndication.twitter.com; connect-src 'self' https://disqus.com https://*.disqus.com https://*.disquscdn.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
