# go.ondralinek.cz — HTTP only, used until the TLS certificate exists.
# deploy/enable-tls.sh swaps this for go-blog.conf once DNS points at the server.
# Source of truth: https://github.com/ondrej-li/go-blog/tree/master/deploy

server {
    listen 80;
    listen [::]:80;
    server_name go.ondralinek.cz;

    root /var/www/go-blog;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/go-blog.access.log;
    error_log  /var/log/nginx/go-blog.error.log;

    # Plain HTTP headers only: HSTS and upgrade-insecure-requests belong to the
    # TLS vhost and would break the site while it is still served over HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Pages are never cached, so a new article is visible immediately; assets
    # are cached for a month.
    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
