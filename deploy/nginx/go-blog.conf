# go.ondralinek.cz — static Hugo build of the Go blog.
# Installed as /etc/nginx/sites-available/go-blog by deploy/deploy.sh.
# Source of truth: https://github.com/ondrej-li/go-blog/tree/master/deploy

server {
    listen 80;
    listen [::]:80;
    server_name go.ondralinek.cz;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/go-blog;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name go.ondralinek.cz;

    root /var/www/go-blog;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/go.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/go-blog.access.log;
    error_log  /var/log/nginx/go-blog.error.log;

    include /etc/nginx/snippets/go-blog-headers.conf;

    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Pages are never cached, so a new article is visible immediately; assets
    # are cached for a month.
    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
        include /etc/nginx/snippets/go-blog-headers.conf;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        include /etc/nginx/snippets/go-blog-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
